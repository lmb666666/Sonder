# Sonder 站点配置；字段结构由 src/content.config.ts 校验。
[config.site]
# 站点标题：导航、页脚和页面标题的公共名称
title = "Sonder"
# 通用描述：feed 和默认 meta description
description = "Sonder 的个人博客。"
# 首页专用标题与描述；其他页面会自动拼接站点标题
pageTitle = "Sonder"
pageDescription = "记录长文、碎片与书影音。"
# 线上地址：canonical、sitemap 和订阅链接的基准
url = "https://sonder.liang.one"
# 仓库地址：页脚 Powered by 与友链申请默认使用
repository = "https://github.com/lmb666666/Sonder"
# 页脚许可/版权说明
footerNote = "署名-非商业性使用-相同方式共享 4.0 国际（CC BY-NC-SA 4.0）"
# 站点建立日期（站点信息卡的运行时长；留空隐藏该行）
timeEstablished = "2026-10-04"

[config.siteInfo]
# 站点信息卡标题
title = "站点信息"
# 站点程序（显示在站点信息卡；留空同时隐藏页脚 Powered by）
program = "Sonder"
# 是否显示运行时长、上次构建时间和 CI 构建平台
uptime = true
lastUpdated = true
buildPlatform = true

# 可选图床信息；关闭时整行隐藏
[config.siteInfo.imageBed]
enabled = false
# 图床显示名称
name = ""
# Lucide 图标名称
icon = ""

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
# 项目默认使用暖橙。
palette = "orange-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"
# 导航栏样式："bar" 通栏工具条（品牌 + 文字导航 + 操作区）；
# "pill" 居中胶囊导航（品牌移除，头像与导航同基线，跨页时头像与首页大头像交换）。
navStyle = "pill"

[config.fonts]
# UI 英文字体名称（CSS font-family，不是文件路径）
en = "Maple Mono"
# 代码字体名称
code = "Monaco"
# 中文阅读字体名称；模板内置 ChillRoundM，也可换成 LXGW WenKai
zh = "ChillRoundM"
# 中文源字体：仅构建期读取，用于生成 UI / 内容子集（子集输出到 public/fonts）。
# 源文件不会部署到站点，可放在 public 之外的任意项目路径。
file = "assets/fonts/ChillRoundM.woff2"

[config.code]
# Expressive Code 主题名称
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
# 代码块显示行号、自动换行、保留缩进
lineNumbers = true
wrap = true
preserveIndent = true
# 折叠样式：github / collapsible-start / collapsible-end / collapsible-auto
collapseStyle = "collapsible-auto"

[config.markdown]
# 数学公式：关闭后不注入 KaTeX / MathJax
math = true
# 数学渲染器："katex" | "mathjax"
mathRenderer = "katex"
# Mermaid 图表：关闭后不打包 mermaid
mermaid = true

[config.music]
# Meting API 实例地址，供 NeteasePlaylist 组件构建期解析歌单。
# 支持 :server/:type/:id/:r 占位符；默认使用社区公共实例，可换成自建实例。
# 实例不可达时组件自动降级为打开歌单的链接卡片。
meting_api = "https://api.qijieya.cn/meting/?server=:server&type=:type&id=:id&r=:r"

[config.friendCircle]
# Friend-Circle-Lite 订阅源（URL 或 public/ 下的文件路径）。
# 留空时优先读取 public/friend-circle.json；否则抓取真实友链 RSS（示例域名跳过），最后回退内置演示数据。
# feed_src = "https://fcl.example.com/api"
feed_src = ""
# 朋友圈每次展示的条数
pageSize = 20

[config.article]
# 是否显示文章底部分享卡片
share = true
# 是否显示上一篇 / 下一篇
navigation = true
# 是否显示更多文章（最多 3 条）
morePosts = true

[config.comments]
# 评论总开关；provider 可选 giscus / utterances / waline / twikoo / none
enabled = false
# 默认评论提供方
provider = "none"
# 是否在文章页显示评论
show_on_posts = true

[config.comments.twikoo]
# Twikoo 环境地址（自部署或云托管实例的 URL）
env_id = ""
# 客户端脚本地址；留空使用 jsDelivr 默认源
script_src = ""
lang = "zh-CN"

[config.search]
# 是否启用 Pagefind 搜索
enabled = true
# 快捷键目前只支持 mod+k
shortcut = "mod+k"
# 搜索框占位与最大结果数
placeholder = "搜索文章…"
maxResults = 6

# 文章归档页文案；note 留空时不显示
[config.pages.blog]
title = "文章"
kicker = "归档"
subtitle = "长文与随想的归档。"
note = ""
# 每页文章数
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式（仅 rows 布局生效）："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"
# 文章列表布局："rows" 行式列表（标题 + 序号 + 摘要 + 小缩略图），"media" 媒体布局（标题 + 元信息 + 大图，仿 krisyan.dev）。
listLayout = "media"

# 动态页文案
[config.pages.moments]
title = "动态"
kicker = "Moments"
subtitle = "记录生活点滴。"
note = ""
# Ech0 后端地址（可选）。配置后动态页改为在浏览器里拉取真实动态；留空使用内置演示数据。
apiUrl = ""
# 每页动态数量
pageSize = 20
# 是否显示 Powered by
showPoweredBy = true

# 书影音页文案
[config.pages.media]
title = "书影音"
kicker = "Media"
subtitle = "读过、看过、听过的作品。"
note = ""

# 朋友页文案
[config.pages.links]
title = "朋友"
kicker = "Friends"
subtitle = "那些人，那些事。"

# Giscus 配置；repo_id 和 category_id 可在 giscus.app 生成
[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

# Utterances 配置；repo 为 GitHub 仓库，issue_term 默认按路径匹配
[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

# Waline 配置；server_url 留空时评论不可用
[config.comments.waline]
server_url = ""
lang = "zh-CN"
# 深色模式选择器
dark = "html.dark"
# 是否启用评论
comment = true

# 作者资料；头像支持 /public 路径或远程 URL
[config.profile]
name = "Sonder"
handle = "@sonder"
role = "写博客的人"
email = "hello@sonder.liang.one"
website = "https://sonder.liang.one"
github = "https://github.com/lmb666666/Sonder"
avatar = "/images/logo.svg"

# 顶部导航；href 为普通链接，module 引用已启用的页面模块
[[config.topNav.links]]
label = "首页"
href = "/"

[[config.topNav.links]]
label = "文章"
href = "/blog"


[[config.topNav.links]]
label = "书影音"
module = "media"

[[config.topNav.links]]
label = "动态"
href = "/moments"


[[config.topNav.links]]
label = "朋友"
href = "/links"

[[config.topNav.links]]
label = "关于"
href = "/about"

# 首页内容
[config.home]

# 首页引语（可选）：数组每一项是一行；整段删除后首页不显示引语
# [config.home.quote]
# text = [
#   "慢慢写，",
#   "慢慢读。",
# ]

# 首页介绍标题、名字和正文段落
[config.home.intro]
title = "here is Sonder"
name = "Sonder"
body = [
  "一个安静写字的地方。",
  "长文进博客，碎片进随记，书影音各归其位。",
]

[config.home.latest]
# 首页「最新」展示的文章数
count = 2
# 热力图周数
heatmapWeeks = 20
# 是否显示首页「最新」与热力图区块
showHeatmapLatest = true
# 是否排除草稿
excludeDraft = true
# 热力图起始日期；留空则按最近周数计算
startDate = ""
# 热力图日期链接前缀；留空时链接到当天第一篇文章
dateArchiveBaseHref = ""

# 首页联系方式；copy = true 时点击复制 tooltip
[[config.home.links]]
label = "GitHub"
icon = "github"
tooltip = "https://github.com/lmb666666/Sonder"
copy = false

[[config.home.links]]
label = "Email"
icon = "mail"
tooltip = "hello@sonder.liang.one"
copy = true

[[config.home.links]]
label = "RSS"
icon = "rss"
tooltip = "/rss.xml"
copy = false
