# Sonder 站点配置；字段结构由 src/config/schema/ 校验。
# 分区：站点身份 / 导航 / 外观 / 页面 / 内容 / 第三方集成。

# ── 站点身份 ─────────────────────────────────────

[config.site]
# 站点标题：导航、页脚和页面标题的公共名称
title = "Sonder"
# 通用描述：feed 和默认 meta description
description = "Sonder 的个人博客。"
# 首页专用标题与描述；其他页面会自动拼接站点标题
pageTitle = "Sonder"
pageDescription = "记录长文、碎片与书影音。"
# 线上地址：canonical、sitemap 和订阅链接的基准
url = "https://sonder.liang.one"
# 仓库地址：页脚 Powered by 与友链申请默认使用
repository = "https://github.com/lmb666666/Sonder"
# 页脚许可/版权说明
footerNote = "署名-非商业性使用-相同方式共享 4.0 国际（CC BY-NC-SA 4.0）"
# 站点建立日期（站点信息卡的运行时长；留空隐藏该行）
timeEstablished = "2026-10-04"

[config.site.info]
# 站点信息卡标题
title = "站点信息"
# 站点程序（显示在站点信息卡；留空同时隐藏页脚 Powered by）
program = "Sonder"
# 是否显示运行时长、总字数、内容最后更新、构建时间和 CI 构建平台
uptime = true
totalWords = true
lastContentUpdate = true
lastUpdated = true
buildPlatform = true

# 可选图床信息；关闭时整行隐藏
[config.site.info.imageBed]
enabled = false
# 图床显示名称
name = ""

# 作者资料；头像支持 /public 路径或远程 URL
[config.site.profile]
name = "Sonder"
role = "写博客的人"
avatar = "/images/logo.svg"

# ── 导航与搜索 ───────────────────────────────────

[[config.nav.links]]
label = "首页"
href = "/"

[[config.nav.links]]
label = "文章"
href = "/blog"

[[config.nav.links]]
label = "书影音"
href = "/media"

[[config.nav.links]]
label = "动态"
href = "/moments"

[[config.nav.links]]
label = "朋友"
href = "/links"

[[config.nav.links]]
label = "关于"
href = "/about"

[config.nav.search]
# 是否启用 Pagefind 搜索
enabled = true
# 搜索框占位与最大结果数
placeholder = "搜索文章…"
maxResults = 6

# ── 外观与排版 ───────────────────────────────────

[config.appearance.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
# 项目默认使用暖橙。
palette = "orange-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"
# 导航栏样式："bar" 通栏工具条（品牌 + 文字导航 + 操作区）；
# "pill" 居中胶囊导航（品牌移除，头像与导航同基线，跨页时头像与首页大头像交换）。
navStyle = "pill"

[config.appearance.fonts]
# UI 英文字体名称（CSS font-family，不是文件路径）
en = "Maple Mono"
# 代码字体名称
code = "Monaco"
# 中文阅读字体名称；模板内置 ChillRoundF（寒蝉全圆体）
zh = "ChillRoundF"
# 中文源字体：仅构建期读取，用于生成 UI / 内容子集（子集输出到 public/fonts）。
# 源文件不会部署到站点，可放在 public 之外的任意项目路径。
file = "assets/fonts/ChillRoundFRegular.woff2"

[config.appearance.code]
# 代码块显示行号、自动换行、保留缩进
lineNumbers = true
# 桌面端不自动换行（横向滚动），移动端仍由样式强制换行
wrap = false
preserveIndent = true
# 折叠样式：github / collapsible-start / collapsible-end / collapsible-auto
collapseStyle = "collapsible-auto"
# 右上角显示语言徽章
languageBadge = true
# 超过该行数自动折叠；previewLines 为折叠时预览行数
collapseLines = 15
previewLines = 8

[config.appearance.markdown]
# 数学公式：关闭后不注入 KaTeX / MathJax
math = true
# 数学渲染器："katex" | "mathjax"
mathRenderer = "katex"
# Mermaid 图表：关闭后不打包 mermaid
mermaid = true

# ── 页面文案 ─────────────────────────────────────

# 文章归档页文案；note 留空时不显示
[config.pages.blog]
title = "文章"
kicker = "归档"
subtitle = "长文与随想的归档。"
note = ""
# 每页文章数
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式（仅 rows 布局生效）："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"
# 文章列表布局："rows" 行式列表（标题 + 序号 + 摘要 + 小缩略图），"media" 媒体布局（标题 + 元信息 + 大图，仿 krisyan.dev）。
listLayout = "media"

# 动态页文案；数据源在 [config.integrations.moments]
[config.pages.moments]
title = "动态"
kicker = "Moments"
subtitle = "记录生活点滴。"
note = ""

# 书影音页文案
[config.pages.media]
title = "书影音"
kicker = "Media"
subtitle = "读过、看过、听过的作品。"
note = ""

# 朋友页文案
[config.pages.links]
title = "朋友"
kicker = "Friends"
subtitle = "那些人，那些事。"

# ── 内容展示 ─────────────────────────────────────

[config.article]
# 是否显示文章底部分享卡片
share = true
# 是否显示上一篇 / 下一篇
navigation = true
# 是否显示更多文章（最多 3 条）
morePosts = true

# 首页内容
[config.home]

# 首页引语（可选）：数组每一项是一行；整段删除后首页不显示引语
# [config.home.quote]
# text = [
#   "慢慢写，",
#   "慢慢读。",
# ]

# 首页介绍标题、名字和正文段落
[config.home.intro]
title = "here is Sonder"
name = "Sonder"
body = [
  "一个安静写字的地方。",
  "长文进博客，碎片进随记，书影音各归其位。",
]

[config.home.latest]
# 首页「最新」展示的文章数
count = 2
# 热力图周数
heatmapWeeks = 20
# 是否显示首页「最新」与热力图区块；关闭后两块一起隐藏
showHeatmapLatest = true
# 是否排除草稿
excludeDraft = true
# 热力图起始日期；留空则按最近周数计算
startDate = ""

# 首页联系方式；copy = true 时点击复制 tooltip
[[config.home.links]]
label = "GitHub"
icon = "github"
tooltip = "https://github.com/lmb666666/Sonder"
copy = false

[[config.home.links]]
label = "Email"
icon = "mail"
tooltip = "hello@sonder.liang.one"
copy = true

[[config.home.links]]
label = "RSS"
icon = "rss"
tooltip = "/rss.xml"
copy = false

# ── 第三方集成 ───────────────────────────────────

# 动态数据源：local 使用 src/data/moments.yml；ech0 浏览器请求 all.json
[config.integrations.moments]
provider = "local"
pageSize = 20
showPoweredBy = true

[config.integrations.moments.ech0]
apiUrl = ""

# 评论总开关；provider 可选 giscus / utterances / waline / twikoo / none
[config.integrations.comments]
enable = false
provider = "none"
show_on_posts = true

[config.integrations.comments.twikoo]
env_id = ""
script_src = ""
lang = "zh-CN"

[config.integrations.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.integrations.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.integrations.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
comment = true

# 访问统计（可选）；留空即关闭，不加载任何第三方脚本。
# Umami 与 51la 可以同时配置，但两套统计口径不同，数字不会一致。
[config.integrations.analytics]
sendInDev = false

[config.integrations.analytics.umami]
websiteId = ""
scriptUrl = ""
hostUrl = ""

[config.integrations.analytics.la51]
id = ""
lingqueMonitorId = ""

# Meting API 实例地址：::music 指令与动态页音乐卡共用。
[config.integrations.music]
meting_api = "https://api.qijieya.cn/meting/?server=:server&type=:type&id=:id&r=:r"

# 朋友圈外部渠道：fcl（Friend-Circle-Lite）| youlin（友邻）| none
[config.integrations.friends]
enable = false
provider = "fcl"
pageSize = 20

[config.integrations.friends.fcl]
# provider = "fcl" 时必填：Friend-Circle-Lite 的 all.json 地址
apiUrl = ""

# provider = "youlin" 时，在 [config.integrations.youlin].baseUrl 填写友邻实例地址。
# 朋友圈始终由浏览器请求 {baseUrl}/api/circle。

[config.integrations.youlin]
# 可选：友邻（Youlin）实例地址。
baseUrl = ""
timeoutMs = 8000
# 仅影响 /links 页的友链取数；朋友圈始终客户端请求。
mode = "build"

[config.integrations.youlin.links]
sources = ["youlin", "local"]
group = ""

[config.integrations.youlin.circle]
# 0 表示不传 limit
limit = 0

[config.integrations.youlin.apply]
provider = "auto"
turnstileSiteKey = ""
timeoutMs = 45000

[config.integrations.youlin.directives]
friendCircle = "auto"
friendLinkCard = "auto"
