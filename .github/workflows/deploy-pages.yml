name: Deploy Sonder to GitHub Pages

on:
  push:
    branches:
      - sonder
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install font subsetting tools
        run: python -m pip install --user fonttools brotli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          SITE_URL: https://sonder.liang.one
          SITE_BASE: /
          SONDER_COMMENTS_ENABLED: ${{ vars.SONDER_COMMENTS_ENABLED }}
          SONDER_COMMENTS_PROVIDER: ${{ vars.SONDER_COMMENTS_PROVIDER }}
          SONDER_GISCUS_REPO: ${{ vars.SONDER_GISCUS_REPO }}
          SONDER_GISCUS_REPO_ID: ${{ vars.SONDER_GISCUS_REPO_ID }}
          SONDER_GISCUS_CATEGORY: ${{ vars.SONDER_GISCUS_CATEGORY }}
          SONDER_GISCUS_CATEGORY_ID: ${{ vars.SONDER_GISCUS_CATEGORY_ID }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
