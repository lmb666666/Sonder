[config.site]
title = "Sonder"
description = "Sonder 的个人博客。万千人生，各自成书。"
pageTitle = "Sonder | 万千人生，各自成书"
pageDescription = "每个人都有自己的故事。"
url = "https://sonder.liang.one"
repository = "https://github.com/lmb666666/Sonder"
footerNote = "署名-非商业性使用-相同方式共享 4.0 国际（CC BY-NC-SA 4.0）"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
# Sonder logo 主色 #2A58B5，对应 blue-soft。
palette = "blue-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索文章…"
maxResults = 6

[config.pages.blog]
title = "博客"
kicker = "文章归档"
subtitle = "每个人都有自己的故事。"
note = "长文与短记的归档，慢慢写，慢慢读。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "按题索引"
subtitle = ""
note = "从文章元信息汇总的常用话题。"

[config.pages.blog.series]
title = "系列"
kicker = "阅读路径"
subtitle = ""
note = "按写作顺序连缀的系列文章。"

[config.pages.projects]
title = "项目"
kicker = "项目架"
subtitle = "小工具与站点系统。"
note = "实现选择、发布与实验的陈列架。"

[config.pages.vibe]
title = "随记"
kicker = ""
subtitle = "生活与代码的碎片。"
note = "不够写成文章，但也是故事的一部分。"
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Sonder"
handle = "@sonder"
role = "每个人都有自己的故事"
email = "hello@sonder.liang.one"
website = "https://sonder.liang.one"
github = "https://github.com/lmb666666/Sonder"
avatar = "/images/logo.svg"

